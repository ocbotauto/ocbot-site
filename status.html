  <h1>Service status</h1>
  <p class="lede">The check runs from your browser; the page refreshes once a minute.</p>
  <div id="list" aria-live="polite"></div>
  <footer id="foot">
  <span></span>

  <span></span></footer>

<script>
(function () {
  // Worker addresses. While an address is empty, the service shows as “not connected”.
  var SALES_URL = "https://ocbot-sales.ocbotauto.workers.dev";
  var SUPPORT_URL = "https://ocbot-support.ocbotauto.workers.dev";
  var CATALOG_URL = "https://ocbot-catalog.ocbotauto.workers.dev";
  var S = [
    { name: "Order processing and key delivery", note: "If this is down, payment isn’t lost: the key arrives once it’s back up.", url: SALES_URL, path: "/config", ok: function (j) { return !!(j && j.address && j.prices); } },
    { name: "Support (chat and Telegram)", note: "Answers from the knowledge base, forwarded to the owner.", url: SUPPORT_URL, path: "/health", ok: function (j) { return !!(j && j.ok); },
      extra: function (j) { return j && j.ok && !j.ai && !j.backup ? "running on FAQ" : ""; } },
    { name: "Preset catalog", note: "Data for the “Catalog” page.", url: CATALOG_URL, path: "/catalog.json", ok: function (j) { return !!(j && j.entries); } }
  ];
  var list = document.getElementById("list"), foot = document.getElementById("foot");
  function timeout(ms) { var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal; }
  function render(res) {
    list.innerHTML = res.map(function (r) {
      var cls = r.state === "ok" ? "ok" : r.state === "off" ? "warn" : "bad";
      var txt = r.state === "ok" ? "up" : r.state === "off" ? "not connected" : "down";
      return '<div class="row"><div><b></b><small></small></div><span class="st ' + cls + '"><span class="dot"></span>' + txt + (r.extra ? ' · ' + r.extra : '') + '</span></div>';
    }).join("");
    var rows = list.querySelectorAll(".row");
    res.forEach(function (r, i) { rows[i].querySelector("b").textContent = r.name; rows[i].querySelector("small").textContent = r.note; });
    foot.textContent = "Checked: " + new Date().toLocaleTimeString("en-US");
  }
  function check() {
    Promise.all(S.map(function (s) {
      var base = { name: s.name, note: s.note };
      if (!s.url) return Promise.resolve(Object.assign(base, { state: "off" }));
      return fetch(s.url.replace(/\/+$/, "") + s.path, { signal: timeout(8000), cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) { return Object.assign(base, { state: s.ok(j) ? "ok" : "bad", extra: s.extra ? s.extra(j) : "" }); },
              function () { return Object.assign(base, { state: "bad" }); });
    })).then(render);
  }
  check(); setInterval(check, 60000);
})();
</script>
