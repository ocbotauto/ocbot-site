name: Rebuild model pages from catalog
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate model pages from live catalog
        run: python3 build_models.py --url https://ocbot-catalog.ocbotauto.workers.dev/catalog.json --base https://ocbot.org/
      - name: Refresh network data for the calculator's $ estimate
        run: python3 build_network.py
      - name: Commit and push if changed
        run: |
          git config user.name "ocbot-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update model pages from catalog"
          git push
