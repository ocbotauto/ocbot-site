# Раз в сутки обновляет страницы моделей из общего каталога (нужны переменные репозитория CATALOG_URL и SITE_BASE).
name: models
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_models.py --url "${{ vars.CATALOG_URL }}" --base "${{ vars.SITE_BASE }}"
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A "*.html" sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "обновление страниц моделей" && git push)
