<div class="wrap">
  <nav aria-label="Разделы сайта"><a href="index.ru.html">OCBot: авторазгон</a><a href="catalog.ru.html">Каталог</a><a href="buy.ru.html">Купить</a><a href="guide.ru.html">Инструкция</a><a href="#" onclick="try{localStorage.setItem('ocbot_lang','en');location.href='status.html';}catch(e){}return false;">EN</a></nav>
  <h1>Статус сервисов</h1>
  <p class="lede">Проверка идёт из вашего браузера, страница обновляется раз в минуту.</p>
  <div id="list" aria-live="polite"></div>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  // Адреса воркеров. Пока адрес пуст, сервис показывается как «не подключён».
  var SALES_URL = "";
  var SUPPORT_URL = "";
  var CATALOG_URL = "https://ocbot-catalog.makar2186.workers.dev";
  var S = [
    { name: "Приём заказов и выдача ключей", note: "Если здесь сбой, оплата не потеряется: ключ придёт после восстановления.", url: SALES_URL, path: "/config", ok: function (j) { return !!(j && j.address && j.prices); } },
    { name: "Поддержка (чат и Telegram)", note: "Ответы по базе знаний и пересылка владельцу.", url: SUPPORT_URL, path: "/health", ok: function (j) { return !!(j && j.ok); },
      extra: function (j) { return j && j.ok && !j.ai && !j.backup ? "работает по FAQ" : ""; } },
    { name: "Каталог пресетов", note: "Данные для страницы «Каталог».", url: CATALOG_URL, path: "/catalog.json", ok: function (j) { return !!(j && j.entries); } }
  ];
  var list = document.getElementById("list"), foot = document.getElementById("foot");
  function timeout(ms) { var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal; }
  function render(res) {
    list.innerHTML = res.map(function (r) {
      var cls = r.state === "ok" ? "ok" : r.state === "off" ? "warn" : "bad";
      var txt = r.state === "ok" ? "работает" : r.state === "off" ? "не подключён" : "недоступен";
      return '<div class="row"><div><b></b><small></small></div><span class="st ' + cls + '"><span class="dot"></span>' + txt + (r.extra ? ' · ' + r.extra : '') + '</span></div>';
    }).join("");
    var rows = list.querySelectorAll(".row");
    res.forEach(function (r, i) { rows[i].querySelector("b").textContent = r.name; rows[i].querySelector("small").textContent = r.note; });
    foot.textContent = "Проверено: " + new Date().toLocaleTimeString("ru-RU");
  }
  function check() {
    Promise.all(S.map(function (s) {
      var base = { name: s.name, note: s.note };
      if (!s.url) return Promise.resolve(Object.assign(base, { state: "off" }));
      return fetch(s.url.replace(/\/+$/, "") + s.path, { signal: timeout(8000), cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) { return Object.assign(base, { state: s.ok(j) ? "ok" : "bad", extra: s.extra ? s.extra(j) : "" }); },
              function () { return Object.assign(base, { state: "bad" }); });
    })).then(render);
  }
  check(); setInterval(check, 60000);
})();
</script>
