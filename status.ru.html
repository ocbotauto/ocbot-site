<script>
(function () {

  var SALES_URL = "https://ocbot-sales.ocbotauto.workers.dev";
  var SUPPORT_URL = "";

  var S = [
    { name: "РџСЂРёС‘Рј Р·Р°РєР°Р·РѕРІ Рё РІС‹РґР°С‡Р° РєР»СЋС‡РµР№", note: "Р•СЃР»Рё Р·РґРµСЃСЊ СЃР±РѕР№, РѕРїР»Р°С‚Р° РЅРµ РїРѕС‚РµСЂСЏРµС‚СЃСЏ: РєР»СЋС‡ РїСЂРёРґС‘С‚ РїРѕСЃР»Рµ РІРѕСЃСЃС‚Р°РЅРѕРІР»РµРЅРёСЏ.", url: SALES_URL, path: "/config", ok: function (j) { return !!(j && j.address && j.prices); } },
    { name: "РџРѕРґРґРµСЂР¶РєР° (С‡Р°С‚ Рё Telegram)", note: "РћС‚РІРµС‚С‹ РїРѕ Р±Р°Р·Рµ Р·РЅР°РЅРёР№ Рё РїРµСЂРµСЃС‹Р»РєР° РІР»Р°РґРµР»СЊС†Сѓ.", url: SUPPORT_URL, path: "/health", ok: function (j) { return !!(j && j.ok); },
      extra: function (j) { return j && j.ok && !j.ai && !j.backup ? "СЂР°Р±РѕС‚Р°РµС‚ РїРѕ FAQ" : ""; } },
    { name: "РљР°С‚Р°Р»РѕРі РїСЂРµСЃРµС‚РѕРІ", note: "Р”Р°РЅРЅС‹Рµ РґР»СЏ СЃС‚СЂР°РЅРёС†С‹ В«РљР°С‚Р°Р»РѕРіВ».", url: CATALOG_URL, path: "/catalog.json", ok: function (j) { return !!(j && j.entries); } }
  ];
  var list = document.getElementById("list"), foot = document.getElementById("foot");
  function timeout(ms) { var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal; }
  function render(res) {
    list.innerHTML = res.map(function (r) {

      var txt = r.state === "ok" ? "СЂР°Р±РѕС‚Р°РµС‚" : r.state === "off" ? "РЅРµ РїРѕРґРєР»СЋС‡С‘РЅ" : "РЅРµРґРѕСЃС‚СѓРїРµРЅ";
